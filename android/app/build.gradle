plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.flipflop.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.flipflop.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // libflipflop.so is produced by android/build.sh (cargo ndk) into src/main/jniLibs.
    sourceSets.main.jniLibs.srcDirs = ['src/main/jniLibs']

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Camera-based QR scanner activity (pure Java, no Google Play Services needed).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
