[package]
name = "flipflop"
version = "0.1.0"
edition = "2024"
# iroh-ble-transport and blew are AGPL-3.0-or-later, which this app inherits.
license = "AGPL-3.0-or-later"

# The command line client. `doc = false`: it shares the library's name, which `cargo doc` would collide on.
[[bin]]
name = "flipflop"
path = "src/bin/flipflop.rs"
doc = false

[dependencies]
iroh = { version = "1.4.1", features = ["unstable-custom-transports"] }
iroh-mdns-address-lookup = "0.6.1"
iroh-tickets = "1.0.0"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
automerge = "0.12.0"
# Apps: wasm modules run by an interpreter (no JIT, so it runs anywhere), talking CBOR with the host.
wasmi = { version = "1.1", default-features = false, features = ["std"] }
ciborium = "0.2"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Guest links: a small HTTP + WebSocket server for browsers on the LAN.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-compression = { version = "0.4.51", features = ["tokio", "zstd"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
hostname = "0.4"
dirs = "6"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = "5"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# BLE transport for iroh; its blew dependency supports Apple/Linux/Android only.
iroh-ble-transport = "0.5.1-beta.7"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
blew = "0.5.1-beta.8"
jni22 = { package = "jni", version = "0.22" }
android_logger = "0.15"
log = "0.4"

# The app (Freya UI over this crate): the desktop GUI and the Android library.
[workspace]
members = ["app"]

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# Small overall, but fast where files pass through: QUIC, its crypto, compression, hashing, file I/O
# (and this crate, where their generic code ends up).
[profile.release.package]
flipflop = { opt-level = 3 }
iroh = { opt-level = 3 }
noq = { opt-level = 3 }
noq-proto = { opt-level = 3 }
noq-udp = { opt-level = 3 }
rustls = { opt-level = 3 }
ring = { opt-level = 3 }
tokio = { opt-level = 3 }
bytes = { opt-level = 3 }
async-compression = { opt-level = 3 }
compression-codecs = { opt-level = 3 }
zstd = { opt-level = 3 }
zstd-safe = { opt-level = 3 }
zstd-sys = { opt-level = 3 }
blake3 = { opt-level = 3 }

[dev-dependencies]
wat = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
