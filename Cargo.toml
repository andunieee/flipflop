[package]
name = "flipflop"
version = "0.1.0"
edition = "2024"
# iroh-ble-transport and blew are AGPL-3.0-or-later, which this app inherits.
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only for generating the Kotlin bindings (see kmp/README.md).
bindgen = ["uniffi/cli"]

[dependencies]
iroh = { version = "1.4.1", features = ["unstable-custom-transports"] }
iroh-ble-transport = "0.5.1-beta.7"
iroh-mdns-address-lookup = "0.6.1"
iroh-tickets = "1.0.0"
n0-future = "0.3.2"
n0-watcher = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
rqrr = "0.11"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
automerge = "0.12.0"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
uniffi = "0.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Guest links: a small HTTP + WebSocket server for browsers on the LAN.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
hostname = "0.4"
dirs = "6"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = "5"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
blew = "0.5.1-beta.8"
jni22 = { package = "jni", version = "0.22" }
android_logger = "0.15"
log = "0.4"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
