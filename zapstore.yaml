# Zapstore listing for the Android app; the release workflow publishes the .apk of each GitHub release with zsp.
repository: https://github.com/andunieee/flipflop
name: FlipFlop
summary: Share files, texts and a scratchpad with your devices, peer to peer
description: |
  FlipFlop connects your devices directly, over the local network, Bluetooth or the internet, with no account and no server in the middle. Make groups, offer files, paste texts and edit a shared scratchpad. Guests can join a group from a browser with a link.
