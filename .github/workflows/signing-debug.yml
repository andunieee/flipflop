name: signing-debug

# Temporary diagnostic: reports only hashes and pass/fail, never a secret value.
on:
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect keystore
        env:
          B64: ${{ secrets.FLIPFLOP_KEYSTORE_B64 }}
          STORE: ${{ secrets.FLIPFLOP_KEYSTORE_PASSWORD }}
          KEY: ${{ secrets.FLIPFLOP_KEY_PASSWORD }}
          OLD_KEY: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -u
          printf '%s' "$B64" | tr -d ' \t\r\n' | base64 -d > ks.p12
          echo "sha256: $(sha256sum ks.p12 | cut -d' ' -f1)"
          echo "size: $(stat -c%s ks.p12)"
          echo "--- MAC check with FLIPFLOP_KEYSTORE_PASSWORD ---"
          if openssl pkcs12 -in ks.p12 -noout -passin env:STORE >/dev/null 2>&1; then
            echo "MAC OK"
          else
            echo "MAC FAILED"
          fi
          cat > K.java <<'EOF'
          import java.io.File;
          import java.security.KeyStore;
          public class K {
              static void key(KeyStore ks, String label, char[] pw) {
                  try {
                      ks.getKey("flipflop", pw);
                      System.out.println("getKey(" + label + "): OK");
                  } catch (Exception e) {
                      System.out.println("getKey(" + label + "): FAILED " + e.getClass().getSimpleName() + ": " + e.getMessage());
                  }
              }
              public static void main(String[] args) throws Exception {
                  KeyStore ks = KeyStore.getInstance(new File("ks.p12"), System.getenv("STORE").toCharArray());
                  System.out.println("containsAlias: " + ks.containsAlias("flipflop"));
                  key(ks, "FLIPFLOP_KEY_PASSWORD", System.getenv("KEY").toCharArray());
                  key(ks, "FLIPFLOP_KEYSTORE_PASSWORD", System.getenv("STORE").toCharArray());
                  key(ks, "SIGNING_KEY_PASSWORD", System.getenv("OLD_KEY").toCharArray());
              }
          }
          EOF
          java K.java
