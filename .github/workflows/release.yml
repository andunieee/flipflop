name: Release

# Builds every package when a "v" tag is pushed (or by hand, to just check they build):
#   linux   : .deb, .rpm, .AppImage, .flatpak, an Arch .pkg.tar.zst and a .tar.gz of the portable app (x86_64)
#   windows : .msi installer and a portable .zip (x86_64)
#   macos   : .dmg (Apple Silicon, unsigned)
#   android : .apk (signed with the ANDROID_KEYSTORE_* secrets when set, with the debug key otherwise)
# The desktop packages are the release flipflop-gui (crate app/, the Freya UI over the core), on its own.
# After the GitHub release, the Arch package goes to the AUR (flipflop-bin) and the .apk to Zapstore; each is skipped,
# with a warning, until its secrets are set (see "Publishing" in the README).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (x86_64)
    runs-on: ubuntu-22.04 # the oldest glibc we can get, so the packages run on most distros
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          [ "${GITHUB_REF_TYPE}" = tag ] || exit 0
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "v${crate}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version ${crate}"; exit 1; }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libv4l-dev libclang-dev libssl-dev libwayland-dev pkg-config rpm fakeroot imagemagick \
            libfontconfig1-dev libfreetype-dev libgl-dev libegl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          packaging/linux/stage.sh
          packaging/linux/deb.sh
          packaging/linux/rpm.sh
          packaging/linux/appimage.sh
          mkdir -p out
          mv "dist/flipflop_${version}_amd64.deb" "out/flipflop-linux-amd64-v${version}.deb"
          mv dist/flipflop-*.x86_64.rpm "out/flipflop-linux-x86_64-v${version}.rpm"
          mv "dist/flipflop-${version}-x86_64.AppImage" "out/flipflop-linux-x86_64-v${version}.AppImage"
          tar -czf "out/flipflop-linux-x86_64-v${version}.tar.gz" -C dist/stage/portable flipflop

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  # The portable app from the linux job, in the freedesktop runtime (packaging/flatpak).
  flatpak:
    name: flatpak (x86_64)
    needs: linux
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Stage the portable app
        id: stage
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          cp linux/flipflop-linux-x86_64-v${version}.tar.gz packaging/flatpak/flipflop.tar.gz
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: flipflop-linux-x86_64-v${{ steps.stage.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/dev.flipflop.app.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: flipflop-linux-x86_64-v${{ steps.stage.outputs.version }}.flatpak

  # The .deb from the linux job, repackaged for Arch (packaging/aur/pkgbuild.sh, the same PKGBUILD the AUR gets).
  # Signed when the GPG_PRIVATE_KEY (base64 of an exported secret key) and GPG_KEY_ID secrets are set.
  arch:
    name: arch (x86_64)
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux

      - name: Build the .pkg.tar.zst
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          mkdir -p pkgbuild dist
          cp "linux/flipflop-linux-amd64-v${version}.deb" "pkgbuild/flipflop-${version}.deb"
          packaging/aur/pkgbuild.sh "$version" "$(sha256sum pkgbuild/*.deb | cut -d' ' -f1)" > pkgbuild/PKGBUILD
          cp packaging/aur/flipflop-bin.install pkgbuild/
          docker run --rm -v "$PWD/pkgbuild":/pkg archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm --needed base-devel
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "cd /pkg && makepkg --nodeps --noconfirm --noprogressbar"
          '
          cp pkgbuild/flipflop-bin-${version}-1-x86_64.pkg.tar.zst "dist/flipflop-linux-x86_64-v${version}.pkg.tar.zst"

      - name: Sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::warning::GPG_PRIVATE_KEY is not set, the Arch package is not signed"; exit 0; }
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --batch --yes --local-user "$GPG_KEY_ID" --detach-sign --no-armor dist/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/

  windows:
    name: windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # packaging/windows/flipflop.wxs is a WiX 3 installer.
      - name: Install WiX
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset -y --no-progress }
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          powershell -NoProfile -File packaging/windows/msi.ps1
          mkdir -p out
          mv "dist/flipflop-${version}.msi" "out/flipflop-windows-x64-setup-v${version}.msi"
          powershell -NoProfile -Command "Compress-Archive -Force -Path dist/flipflop -DestinationPath 'out/flipflop-windows-x64-v${version}.zip'"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  macos:
    name: macos (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          packaging/macos/dmg.sh
          mkdir -p out
          mv "dist/flipflop-${version}.dmg" "out/flipflop-macos-arm64-v${version}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  android:
    name: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      # Gradle packages the APK (the UI and the node are libflipflop_app, built by cargo-ndk).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      # The base64 of the release .jks is in ANDROID_KEYSTORE_BASE64, with ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them the APK is signed with the debug key.
      - name: Keystore
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$B64" ] || exit 0
          printf '%s' "$B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/android-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/android-release.jks" -storepass "$STORE_PASSWORD" ${KEY_ALIAS:+-alias "$KEY_ALIAS"} >/dev/null 2>&1; then
            echo "::error::Cannot open the release keystore with ANDROID_KEYSTORE_PASSWORD. Check that ANDROID_KEYSTORE_BASE64 was base64-encoded from the .jks, that the password matches and that ANDROID_KEY_ALIAS names an entry in it."
            exit 1
          fi
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          (cd android && ./gradlew :app:assembleRelease -Pprofile=release -Pabis=arm64-v8a,armeabi-v7a,x86_64)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/flipflop-android-v${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  release:
    needs: [linux, flatpak, arch, windows, macos, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAT=$(mktemp -d); NOTES=$(mktemp); cp -v -r dist/*/* "$FLAT"/
          cat > "$NOTES" <<'EOF'
          - **linux**: `.flatpak` (`flatpak install --user flipflop-*.flatpak`), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE), `.pkg.tar.zst` (Arch, or `flipflop-bin` from the AUR), `.AppImage` (any distro, needs FUSE: or run it with `--appimage-extract-and-run`; `--install-desktop-entry` adds it to the menu) or `.tar.gz` (unpack and run `flipflop/bin/flipflop-gui`). Bluetooth needs BlueZ.
          - **windows**: the `-setup-` `.msi` (per user, no admin rights), or extract the `.zip` and run `flipflop\flipflop.exe`. Unsigned: SmartScreen asks "Run anyway".
          - **macos**: Apple Silicon `.dmg`, unsigned: first launch right-click > Open, or `xattr -dr com.apple.quarantine /Applications/flipflop.app`.
          - **android**: the `.apk` (Android 7+), or from [Zapstore](https://zapstore.dev). Allow installing from unknown sources.
          EOF
          gh release create "$TAG" --verify-tag --generate-notes --notes-file "$NOTES"
          gh release upload "$TAG" "$FLAT"/* --clobber

  # Pushes the PKGBUILD of flipflop-bin to the AUR. Needs AUR_SSH_PRIVATE_KEY: the private half of an SSH key added to
  # your AUR account (https://aur.archlinux.org/account). The first push creates the package.
  aur:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the PKGBUILD
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$KEY" ] || { echo "::warning::AUR_SSH_PRIVATE_KEY is not set, not publishing to the AUR"; exit 0; }
          version="${TAG#v}"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "flipflop-linux-amd64-${TAG}.deb" --dir deb
          mkdir -p aur
          packaging/aur/pkgbuild.sh "$version" "$(sha256sum deb/*.deb | cut -d' ' -f1)" > aur/PKGBUILD
          cp packaging/aur/flipflop-bin.install aur/
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        if: steps.stage.outputs.version != ''
        with:
          pkgname: flipflop-bin
          pkgbuild: aur/PKGBUILD
          assets: aur/flipflop-bin.install
          commit_username: andunie
          commit_email: andunie@cassis.cash
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: flipflop-bin ${{ steps.stage.outputs.version }}-1"

  # Publishes the release's .apk to Zapstore (zapstore.yaml). Needs ZAPSTORE_OWNER_NSEC: the nsec (or a bunker:// URL)
  # of the Nostr key that owns the app. Zapstore ties the app to its signing certificate through a NIP-C1 proof, which
  # packaging/zapstore makes from the release keystore, so the ANDROID_KEYSTORE_* secrets must be set too: a
  # debug-signed .apk would bind the listing to the runner's throwaway key.
  zapstore:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packaging/zapstore/go.mod
          cache-dependency-path: packaging/zapstore/go.sum

      # keytool converts the release .jks to the PKCS#12 the proof signer reads.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_OWNER_NSEC || secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGN_WITH" ]; then
            echo "::warning::ZAPSTORE_OWNER_NSEC is not set, skipping the Zapstore publish"
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, skipping the Zapstore publish"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/android-release.jks"
          # The proof signer in packaging/zapstore reads PKCS#12; convert the JKS release keystore to it.
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/android-release.jks" -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "${KEY_ALIAS:-flipflop}" -srckeypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
            -destkeystore "$RUNNER_TEMP/android-release.p12" -deststoretype PKCS12 \
            -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/android-release.p12"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          (cd packaging/zapstore && go build -o "$RUNNER_TEMP/zapstore" .)
          "$RUNNER_TEMP/zapstore"
