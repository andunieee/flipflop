name: Pages

# Publishes the website (site/, at https://flipflop.name/) and the guest page for links from anywhere (web/:
# src/core/guest/page.html plus the group document and iroh in wasm).
# Needs Settings → Pages → Source: "GitHub Actions". The site is:
#   /               the FlipFlop landing page (site/)
#   guest/vX.Y.Z/   one copy per release tag, built from that tag: what an app of that version links to
#                   (src/core/guest.rs). Earlier guest/ versions are fetched from the live site so every
#                   deploy keeps them available.

on:
  push:
    branches: ["master"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
    tags: ["v*"]
  workflow_dispatch: # redeploys the site as it is, without a new version

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GUEST_FILES: index.html sw.js flipflop_web.js flipflop_web_bg.wasm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No fetch-tags: when this runs on a tag, checkout fetches both the commit and the tag to the same
      # ref and git refuses (actions/checkout#1471). The only use of tags is listing them, below.
      - uses: actions/checkout@v4

      - name: Tag is the Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ "v${crate}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version ${crate}"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        if: github.ref_type == 'tag'
        with:
          targets: wasm32-unknown-unknown

      # The CLI must match the wasm-bindgen crate pinned in web/Cargo.toml.
      - name: wasm-bindgen version
        if: github.ref_type == 'tag'
        id: bindgen
        run: |
          v=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' web/Cargo.toml)
          test -n "$v" || { echo "::error::wasm-bindgen must be pinned with = in web/Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        if: github.ref_type == 'tag'
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        if: github.ref_type == 'tag'
        with:
          workspaces: web

      - name: Build
        if: github.ref_type == 'tag'
        run: web/build.sh "$PWD/build"

      - name: Assemble the site
        env:
          SITE: https://flipflop.name
          FALLBACK_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -eu
          mkdir -p _site/guest
          cp -r site/* _site/

          # fetch <path in the site> <file>: from the live site (or fallback github.io URL)
          fetch() {
            mkdir -p "_site/$1"
            curl -fsSL "$SITE/$1${1:+/}$2" -o "_site/$1${1:+/}$2" 2>/dev/null \
              || curl -fsSL "$FALLBACK_SITE/$1${1:+/}$2" -o "_site/$1${1:+/}$2"
          }

          # this release
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            mkdir -p "_site/guest/${GITHUB_REF_NAME}"
            cp build/* "_site/guest/${GITHUB_REF_NAME}/"
          fi

          # the earlier releases; the names come from the remote, since only the pushed tag is in this clone
          tags="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##')"
          for tag in $tags; do
            [ -d "_site/guest/$tag" ] && continue
            ok=1
            for f in $GUEST_FILES; do fetch "guest/$tag" "$f" 2>/dev/null || { ok=0; break; }; done
            if [ $ok = 0 ]; then
              echo "::warning::$tag is not published yet, skipping it"
              rm -rf "_site/guest/$tag"
            fi
          done
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
