[package]
name = "tunnelmanager-slint"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Alternative Slint-based desktop GUI for TunnelManager, using the engine crate directly"
rust-version = "1.91"

[[bin]]
name = "tunnelmanager-slint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
engine = { path = "../engine" }
slint = "1"
anyhow = "1"
tokio = { version = "1.34.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
open = "5"
dirs = "5"
chrono = "0.4"
iroh = "1.0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
