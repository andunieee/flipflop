# The Flatpak repackages the portable app (packaging/linux/stage.sh: the release flipflop-gui) rather than building
# it: cargo cannot run offline in flatpak-builder without vendoring every dependency. `just flatpak` puts that folder
# at packaging/flatpak/flipflop.tar.gz and builds the bundle; so does the release workflow.
app-id: dev.flipflop.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: flipflop
finish-args:
  - --share=ipc
  - --share=network # iroh, and mDNS on the LAN
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all # the GPU, and the webcam for QR codes
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  # files to offer can be anywhere; downloads go to ~/Downloads/flipflop
  - --filesystem=home
  # the same data dir as the command line client outside the sandbox (see flipflop.sh)
  - --filesystem=xdg-data/flipflop:create
modules:
  - name: flipflop
    buildsystem: simple
    # already stripped by the release profile
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - mkdir -p /app/lib && cp -a app /app/lib/flipflop
      - install -Dm755 flipflop.sh /app/bin/flipflop
      - install -Dm644 dev.flipflop.app.desktop -t /app/share/applications
      - install -Dm644 dev.flipflop.app.metainfo.xml -t /app/share/metainfo
      - |
        for s in 16 24 32 48 64 128 256 512; do
          install -Dm644 icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/dev.flipflop.app.png
        done
    sources:
      - type: archive
        path: flipflop.tar.gz
        dest: app
      - type: file
        path: flipflop.sh
      - type: file
        path: ../linux/dev.flipflop.app.desktop
      - type: file
        path: ../linux/dev.flipflop.app.metainfo.xml
      - type: dir
        path: ../icons
        dest: icons
